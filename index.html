<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0;font-size:24px}
.card{background:#1a1a2e;border-radius:16px;padding:20px;width:100%;max-width:400px;margin:10px 0}
.card h3{color:#a78bfa;margin-bottom:12px;font-size:16px}
.balance-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2a3e;font-size:15px}
.balance-item:last-child{border:none}
.balance-item .label{color:#888}
.balance-item .value{font-weight:600;color:#e0d4f5}
.user-info{color:#666;font-size:13px;text-align:center;margin-top:10px}
#status{text-align:center;margin:10px 0;color:#888;font-size:13px}
.error{color:#f87171;font-size:14px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div id="app">
  <h1>Portals</h1>
  <div class="card" id="userCard">
    <h3>Профиль</h3>
    <div class="user-info" id="userInfo">Загрузка...</div>
  </div>
  <div class="card">
    <h3>Баланс</h3>
    <div id="balances">
      <div class="balance-item"><span class="label">TRX</span><span class="value" id="trx">—</span></div>
      <div class="balance-item"><span class="label">USDT</span><span class="value" id="usdt">—</span></div>
      <div class="balance-item"><span class="label">GRAM</span><span class="value" id="gram">—</span></div>
    </div>
  </div>
  <p id="status"></p>
</div>

<script>
var API = 'http://2.26.229.5:4444';

function findWebAppGlobal() {
  var candidates = [];
  Object.keys(window).forEach(function (k) {
    var v = window[k];
    if (v && typeof v === 'object') {
      if (v.WebApp && typeof v.WebApp === 'object') candidates.push(v.WebApp);
      if ('initData' in v || 'initDataUnsafe' in v) candidates.push(v);
    }
  });
  var preferred = ['Telegram', 'Catugram', 'Catup', 'WebApp'];
  var priority = {};
  preferred.forEach(function (n, i) { priority[n] = i; });
  candidates.sort(function (a, b) {
    var na = null, nb = null;
    preferred.forEach(function (p) {
      if (na === null && window[p] && (window[p] === a || (window[p].WebApp === a))) na = priority[p];
      if (nb === null && window[p] && (window[p] === b || (window[p].WebApp === b))) nb = priority[p];
    });
    return (na === null ? 99 : na) - (nb === null ? 99 : nb);
  });
  return candidates[0] || window.TelegramScenario || null;
}

function getInitData(tg) {
  if (tg && typeof tg.initData === 'string' && tg.initData) return tg.initData;
  var q = new URLSearchParams(location.search);
  if (q.get('tgWebAppData')) return q.get('tgWebAppData');
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('tgWebAppData')) return h.get('tgWebAppData');
  return null;
}

function parseUser(initData) {
  try {
    var params = new URLSearchParams(initData);
    var raw = params.get('user');
    if (raw) {
      var obj = JSON.parse(decodeURIComponent(raw));
      if (obj && obj.id) return obj;
    }
  } catch (e) {}
  return null;
}

function resolveUserId() {
  var tg = findWebAppGlobal();
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    return { id: String(tg.initDataUnsafe.user.id), username: tg.initDataUnsafe.user.username, source: 'initDataUnsafe' };
  }
  var initData = getInitData(tg);
  if (initData) {
    var user = parseUser(initData);
    if (user && user.id) {
      return { id: String(user.id), username: user.username, source: 'initData' };
    }
  }
  var q = new URLSearchParams(location.search);
  var uid = q.get('user_id');
  if (uid) return { id: uid, username: q.get('username') || '', source: 'url' };
  return null;
}

async function load(user) {
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Загрузка...';
  document.getElementById('userInfo').textContent =
    (user.username ? user.username : 'user') + ' (ID: ' + user.id + ')' + ' [' + user.source + ']';

  try {
    var res = await fetch(API + '/balance/' + user.id, {
      headers: { 'X-Telegram-Init': getInitData(findWebAppGlobal()) || '' }
    });
    if (!res.ok) {
      statusEl.innerHTML = '<span class="error">Сервер недоступен</span>';
      return;
    }
    var data = await res.json();
    if (data.error) {
      statusEl.innerHTML = '<span class="error">' + data.error + '</span>';
      return;
    }
    document.getElementById('trx').textContent = Number(data.trx || 0).toFixed(4);
    document.getElementById('usdt').textContent = Number(data.usdt || 0).toFixed(4);
    document.getElementById('gram').textContent = Number(data.gram || 0).toFixed(4);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.innerHTML = '<span class="error">Ошибка подключения к серверу</span>';
  }
}

async function init() {
  var started = Date.now();
  var user = resolveUserId();
  while (!user && Date.now() - started < 4000) {
    await new Promise(function (r) { setTimeout(r, 200); });
    user = resolveUserId();
  }
  if (!user) {
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('status').innerHTML =
      '<span class="error">Не удалось получить данные пользователя. Откройте приложение кнопкой в боте.</span>';
    return;
  }
  var tg = findWebAppGlobal();
  if (tg && typeof tg.ready === 'function') tg.ready();
  if (tg && typeof tg.expand === 'function') tg.expand();
  await load(user);
}

init();
</script>
</body>
</html>
