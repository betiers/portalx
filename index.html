<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0e14;color:#f0f0f2;min-height:100vh;padding:0 0 120px}
.avatar{position:fixed;top:12px;right:14px;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:#1c2230;z-index:50;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{font-size:18px;font-weight:700;color:#34d399}
header{padding:18px 18px 8px}
header h1{font-size:20px;font-weight:700;letter-spacing:.3px}
header p{color:#8b93a3;font-size:12px;margin-top:2px}
.card{background:#141a26;border-radius:22px;padding:18px;margin:12px 18px}
.card h3{color:#34d399;margin-bottom:10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px}
.balance-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222a3a;font-size:16px}
.balance-item:last-child{border:none}
.balance-item .label{color:#8b93a3}
.balance-item .value{font-weight:700;color:#fff}
#status{text-align:center;margin:12px 18px;color:#8b93a3;font-size:13px}
.error{color:#f87171;font-size:14px;text-align:center;margin:12px 18px}
.bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px;background:rgba(20,26,38,.92);border:1px solid #222a3a;border-radius:999px;backdrop-filter:blur(10px);z-index:50}
.bar button{width:46px;height:46px;border:0;border-radius:50%;background:#1c2230;color:#8b93a3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar button.active{background:#34d399;color:#0b0e14}
.bar button:active{transform:scale(.92)}
.bar svg{width:22px;height:22px}
</style>
</head>
<body>

<div class="avatar" id="avatar"></div>

<div id="app">
  <header>
    <h1>Portals</h1>
    <p id="userInfo">Загрузка...</p>
  </header>

  <div class="card">
    <h3>Баланс</h3>
    <div id="balances">
      <div class="balance-item"><span class="label">TRX</span><span class="value" id="trx">—</span></div>
      <div class="balance-item"><span class="label">USDT</span><span class="value" id="usdt">—</span></div>
      <div class="balance-item"><span class="label">GRAM</span><span class="value" id="gram">—</span></div>
    </div>
  </div>
  <p id="status"></p>
</div>

<div class="bar">
  <button class="active" id="btnHome" title="Домой">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
  </button>
  <button id="btnRefresh" title="Обновить">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button id="btnWallet" title="Кошелёк" onclick="window.scrollTo(0,0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M16 12.5h.01"/></svg>
  </button>
</div>

<script>
var API = 'http://2.26.229.5:4444';

function findWebAppGlobal() {
  var candidates = [];
  Object.keys(window).forEach(function (k) {
    var v = window[k];
    if (v && typeof v === 'object') {
      if (v.WebApp && typeof v.WebApp === 'object') candidates.push(v.WebApp);
      if ('initData' in v || 'initDataUnsafe' in v) candidates.push(v);
    }
  });
  var preferred = ['Telegram', 'Catugram', 'Catup', 'WebApp'];
  var priority = {};
  preferred.forEach(function (n, i) { priority[n] = i; });
  candidates.sort(function (a, b) {
    var na = null, nb = null;
    preferred.forEach(function (p) {
      if (na === null && window[p] && (window[p] === a || (window[p].WebApp === a))) na = priority[p];
      if (nb === null && window[p] && (window[p] === b || (window[p].WebApp === b))) nb = priority[p];
    });
    return (na === null ? 99 : na) - (nb === null ? 99 : nb);
  });
  return candidates[0] || null;
}

function getInitData(tg) {
  if (tg && typeof tg.initData === 'string' && tg.initData) return tg.initData;
  var q = new URLSearchParams(location.search);
  if (q.get('tgWebAppData')) return q.get('tgWebAppData');
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('tgWebAppData')) return h.get('tgWebAppData');
  return null;
}

function parseUser(initData) {
  try {
    var params = new URLSearchParams(initData);
    var raw = params.get('user');
    if (raw) {
      var obj = JSON.parse(decodeURIComponent(raw));
      if (obj && obj.id) return obj;
    }
  } catch (e) {}
  return null;
}

function resolveUser() {
  var tg = findWebAppGlobal();
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    return tg.initDataUnsafe.user;
  }
  var initData = getInitData(tg);
  if (initData) {
    var user = parseUser(initData);
    if (user && user.id) return user;
  }
  var q = new URLSearchParams(location.search);
  var uid = q.get('user_id');
  if (uid) return { id: uid, username: q.get('username') || '' };
  return null;
}

function renderAvatar(user) {
  var el = document.getElementById('avatar');
  var name = (user.first_name || user.username || 'U').charAt(0).toUpperCase();
  if (user.photo_url) {
    var img = document.createElement('img');
    img.src = user.photo_url;
    img.onerror = function () { el.innerHTML = '<span>' + name + '</span>'; };
    el.innerHTML = '';
    el.appendChild(img);
  } else {
    el.innerHTML = '<span>' + name + '</span>';
  }
}

async function load(user) {
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Обновляю...';
  var name = user.first_name || user.username || 'Portals';
  document.getElementById('userInfo').textContent = name + ' · ID: ' + user.id;

  try {
    var res = await fetch(API + '/balance/' + user.id, {
      headers: { 'X-Telegram-Init': getInitData(findWebAppGlobal()) || '' }
    });
    if (!res.ok) {
      statusEl.innerHTML = '<span class="error">Сервер недоступен</span>';
      return;
    }
    var data = await res.json();
    if (data.error) {
      statusEl.innerHTML = '<span class="error">' + data.error + '</span>';
      return;
    }
    document.getElementById('trx').textContent = Number(data.trx || 0).toFixed(4);
    document.getElementById('usdt').textContent = Number(data.usdt || 0).toFixed(4);
    document.getElementById('gram').textContent = Number(data.gram || 0).toFixed(4);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.innerHTML = '<span class="error">Ошибка подключения к серверу</span>';
  }
}

async function init() {
  var started = Date.now();
  var user = resolveUser();
  while (!user && Date.now() - started < 4000) {
    await new Promise(function (r) { setTimeout(r, 200); });
    user = resolveUser();
  }
  if (!user) {
    document.getElementById('userInfo').textContent = 'Не удалось получить данные. Откройте кнопкой в боте.';
    return;
  }
  var tg = findWebAppGlobal();
  if (tg && typeof tg.ready === 'function') tg.ready();
  if (tg && typeof tg.expand === 'function') tg.expand();
  renderAvatar(user);
  document.getElementById('btnRefresh').addEventListener('click', function () { load(user); });
  document.getElementById('btnHome').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  await load(user);
}

init();
</script>
</body>
</html>
