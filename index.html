<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary-color: #d0bcff;
  --on-primary: #381e72;
  --bg-card: #1d1b20;
  --bg-item: #2b2930;
  --bg-settings: #17151a;
  --text-main: #e6e1e5;
  --text-sub: #cac4d0;
  --font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  overflow-x: hidden;
}

body {
  background: #121015;
  color: var(--text-main);
  font-family: var(--font-family);
  min-height: 100vh;
  padding: 24px 16px 130px;
}

.wrapper {
  max-width: 600px;
  margin: 0 auto;
}

header {
  padding: 0 4px 16px;
  animation: fade 0.5s ease both;
}

header h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text-main);
}

header .sub {
  color: var(--text-sub);
  font-size: 13px;
  margin-top: 2px;
}

.view {
  animation: fade 0.35s ease both;
}

.card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-header {
  display: flex;
  align-items: center;
  padding: 0 4px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .material-symbols-outlined {
  color: var(--primary-color);
  font-size: 20px;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-item);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.row:active {
  background: #34323a;
}

.row .icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(208, 188, 255, 0.14);
  color: var(--primary-color);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.row .icon .material-symbols-outlined {
  font-size: 20px;
}

.row .name {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-main);
}

.row .value {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--text-sub);
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 4px;
}

.dot.trx { background: #6bd0ff; }
.dot.usdt { background: #2bd892; }
.dot.gram { background: var(--primary-color); }

#balanceRow .value { color: var(--primary-color); }

#status {
  text-align: center;
  margin: 14px 0;
  color: var(--text-sub);
  font-size: 12px;
  min-height: 16px;
}

.bar {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  width: max-content;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 7px;
  background: rgba(29, 27, 32, 0.92);
  border-radius: 999px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 50;
  animation: fade 0.4s 0.15s ease both;
}

.bar button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--bg-item);
  color: var(--text-sub);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease, transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

.bar button:hover {
  color: var(--text-main);
}

.bar button:active {
  transform: scale(0.92);
}

.bar button.active {
  background: var(--primary-color);
  color: var(--on-primary);
}

.bar .material-symbols-outlined {
  font-size: 24px;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>Portals</h1>
    <p class="sub" id="userInfo">Загрузка...</p>
  </header>

  <div class="view" id="viewMenu">
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="material-symbols-outlined">menu</span>
          Главное меню
        </div>
      </div>
      <div class="list">
        <div class="row" data-open="balance">
          <span class="icon"><span class="material-symbols-outlined">account_balance_wallet</span></span>
          <span class="name">Баланс</span>
          <span class="value" id="menuSum">—</span>
        </div>
        <div class="row" data-open="shop">
          <span class="icon"><span class="material-symbols-outlined">storefront</span></span>
          <span class="name">Магазин</span>
          <span class="value">скоро</span>
        </div>
        <div class="row" data-open="gifts">
          <span class="icon"><span class="material-symbols-outlined">redeem</span></span>
          <span class="name">Мои подарки</span>
          <span class="value">скоро</span>
        </div>
        <div class="row" data-open="settings">
          <span class="icon"><span class="material-symbols-outlined">settings</span></span>
          <span class="name">Настройки</span>
          <span class="value">скоро</span>
        </div>
      </div>
    </div>
  </div>

  <div class="view" id="viewBalance" style="display:none">
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="material-symbols-outlined">account_balance_wallet</span>
          Баланс
        </div>
      </div>
      <div class="list">
        <div class="row" id="balanceRow">
          <span class="icon"><span class="material-symbols-outlined">currency_bitcoin</span></span>
          <span class="name">TRX</span>
          <span class="value" id="trx">—</span>
        </div>
        <div class="row" id="balanceRow">
          <span class="icon"><span class="material-symbols-outlined">currency_exchange</span></span>
          <span class="name">USDT</span>
          <span class="value" id="usdt">—</span>
        </div>
        <div class="row" id="balanceRow">
          <span class="icon"><span class="material-symbols-outlined">diamond</span></span>
          <span class="name">GRAM</span>
          <span class="value" id="gram">—</span>
        </div>
      </div>
    </div>
  </div>

  <p id="status"></p>
</div>

<div class="bar">
  <button class="active" id="btnMenu" title="Меню">
    <span class="material-symbols-outlined">home</span>
  </button>
</div>

<script>
var API = 'http://2.26.229.5:4444';

function findWebAppGlobal() {
  var candidates = [];
  Object.keys(window).forEach(function (k) {
    var v = window[k];
    if (v && typeof v === 'object') {
      if (v.WebApp && typeof v.WebApp === 'object') candidates.push(v.WebApp);
      if ('initData' in v || 'initDataUnsafe' in v) candidates.push(v);
    }
  });
  var preferred = ['Telegram', 'Catugram', 'Catup', 'WebApp'];
  var priority = {};
  preferred.forEach(function (n, i) { priority[n] = i; });
  candidates.sort(function (a, b) {
    var na = null, nb = null;
    preferred.forEach(function (p) {
      if (na === null && window[p] && (window[p] === a || (window[p].WebApp === a))) na = priority[p];
      if (nb === null && window[p] && (window[p] === b || (window[p].WebApp === b))) nb = priority[p];
    });
    return (na === null ? 99 : na) - (nb === null ? 99 : nb);
  });
  return candidates[0] || null;
}

function getInitData(tg) {
  if (tg && typeof tg.initData === 'string' && tg.initData) return tg.initData;
  var q = new URLSearchParams(location.search);
  if (q.get('tgWebAppData')) return q.get('tgWebAppData');
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('tgWebAppData')) return h.get('tgWebAppData');
  return null;
}

function parseUser(initData) {
  try {
    var params = new URLSearchParams(initData);
    var raw = params.get('user');
    if (raw) {
      var obj = JSON.parse(decodeURIComponent(raw));
      if (obj && obj.id) return obj;
    }
  } catch (e) {}
  return null;
}

function resolveUser() {
  var tg = findWebAppGlobal();
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    return tg.initDataUnsafe.user;
  }
  var initData = getInitData(tg);
  if (initData) {
    var user = parseUser(initData);
    if (user && user.id) return user;
  }
  var q = new URLSearchParams(location.search);
  var uid = q.get('user_id');
  if (uid) return { id: uid, username: q.get('username') || '' };
  return null;
}

function showView(name) {
  var menu = document.getElementById('viewMenu');
  var balance = document.getElementById('viewBalance');
  menu.style.display = name === 'menu' ? '' : 'none';
  balance.style.display = name === 'balance' ? '' : 'none';
}

function animateValue(el, target) {
  var start = parseFloat(el.textContent) || 0;
  var dur = 700;
  var t0 = performance.now();
  function step(now) {
    var p = Math.min((now - t0) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var v = start + (target - start) * eased;
    if (el === document.getElementById('menuSum')) {
      el.textContent = v.toFixed(2);
    } else {
      el.textContent = v.toFixed(4);
    }
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function load(user) {
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Обновляю...';
  var name = user.first_name || user.username || 'Portals';
  document.getElementById('userInfo').textContent = name;

  try {
    var res = await fetch(API + '/balance/' + user.id, {
      headers: { 'X-Telegram-Init': getInitData(findWebAppGlobal()) || '' }
    });
    if (!res.ok) { statusEl.textContent = ''; return; }
    var data = await res.json();
    if (data.error) { statusEl.textContent = ''; return; }
    animateValue(document.getElementById('trx'), Number(data.trx || 0));
    animateValue(document.getElementById('usdt'), Number(data.usdt || 0));
    animateValue(document.getElementById('gram'), Number(data.gram || 0));
    animateValue(document.getElementById('menuSum'), Number(data.usdt || 0) + Number(data.trx || 0) + Number(data.gram || 0));
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '';
  }
}

async function init() {
  var started = Date.now();
  var user = resolveUser();
  while (!user && Date.now() - started < 4000) {
    await new Promise(function (r) { setTimeout(r, 200); });
    user = resolveUser();
  }
  if (!user) {
    document.getElementById('userInfo').textContent = 'Откройте приложение кнопкой в боте.';
    return;
  }
  var tg = findWebAppGlobal();
  if (tg && typeof tg.ready === 'function') tg.ready();
  if (tg && typeof tg.expand === 'function') tg.expand();

  document.querySelectorAll('#viewMenu .row').forEach(function (row) {
    row.addEventListener('click', function () {
      var target = row.getAttribute('data-open');
      if (target === 'balance') {
        showView('balance');
      } else {
        statusHint(row.getAttribute('data-open'));
      }
    });
  });

  function statusHint(key) {
    var msgs = { shop: 'Магазин скоро откроется', gifts: 'Подарки скоро появятся', settings: 'Настройки скоро появятся' };
    var statusEl = document.getElementById('status');
    statusEl.textContent = msgs[key] || '';
    setTimeout(function () { statusEl.textContent = ''; }, 2000);
  }

  document.getElementById('btnMenu').addEventListener('click', function () {
    showView('menu');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  await load(user);
}

init();
</script>
</body>
</html>
