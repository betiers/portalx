<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0;font-size:24px}
.card{background:#1a1a2e;border-radius:16px;padding:20px;width:100%;max-width:400px;margin:10px 0}
.card h3{color:#a78bfa;margin-bottom:12px;font-size:16px}
.balance-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2a3e;font-size:15px}
.balance-item:last-child{border:none}
.balance-item .label{color:#888}
.balance-item .value{font-weight:600;color:#e0d4f5}
.user-info{color:#666;font-size:13px;text-align:center;margin-top:10px}
#status{text-align:center;margin:10px 0;color:#888;font-size:13px}
.error{color:#f87171;font-size:14px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div id="app">
  <h1>Portals</h1>
  <div class="card" id="userCard">
    <h3>Профиль</h3>
    <div class="user-info" id="userInfo">Загрузка...</div>
  </div>
  <div class="card">
    <h3>Баланс</h3>
    <div id="balances">
      <div class="balance-item"><span class="label">TRX</span><span class="value" id="trx">—</span></div>
      <div class="balance-item"><span class="label">USDT</span><span class="value" id="usdt">—</span></div>
      <div class="balance-item"><span class="label">GRAM</span><span class="value" id="gram">—</span></div>
    </div>
  </div>
  <p id="status"></p>
</div>

<script>
const API = 'http://2.26.229.5:4444';

function getTg() {
  return window.Telegram?.WebApp || null;
}

function waitForTg(timeoutMs) {
  if (getTg()) return Promise.resolve(getTg());
  return new Promise((resolve) => {
    const started = Date.now();
    const timer = setInterval(() => {
      const tg = getTg();
      if (tg || Date.now() - started > timeoutMs) {
        clearInterval(timer);
        resolve(tg);
      }
    }, 200);
  });
}

function resolveUserId(tg) {
  if (tg?.initDataUnsafe?.user?.id) return String(tg.initDataUnsafe.user.id);
  const initData = tg?.initData;
  if (initData) {
    const params = new URLSearchParams(initData);
    const raw = params.get('user');
    if (raw) {
      try {
        const obj = JSON.parse(decodeURIComponent(raw));
        if (obj?.id) return String(obj.id);
      } catch (e) {}
    }
  }
  const p = new URLSearchParams(location.search);
  return p.get('user_id');
}

async function load(userId) {
  document.getElementById('userCard').style.display = 'block';
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Загрузка...';

  try {
    const res = await fetch(`${API}/balance/${userId}`, {
      headers: { 'X-Telegram-Init': window.Telegram?.WebApp?.initData || '' }
    });
    if (!res.ok) {
      statusEl.innerHTML = '<span class="error">Сервер недоступен</span>';
      return;
    }
    const data = await res.json();
    if (data.error) {
      statusEl.innerHTML = `<span class="error">${data.error}</span>`;
      return;
    }
    document.getElementById('userInfo').textContent =
      `${data.username || 'user'} (ID: ${userId})`;
    document.getElementById('trx').textContent = Number(data.trx ?? 0).toFixed(4);
    document.getElementById('usdt').textContent = Number(data.usdt ?? 0).toFixed(4);
    document.getElementById('gram').textContent = Number(data.gram ?? 0).toFixed(4);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.innerHTML = '<span class="error">Ошибка подключения к серверу</span>';
  }
}

async function init() {
  const tg = await waitForTg(4000);
  if (tg) {
    tg.ready();
    tg.expand();
  }
  const userId = resolveUserId(tg);
  if (!userId) {
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('status').innerHTML =
      '<span class="error">Не удалось получить данные из Telegram (initData пуст). Откройте приложение кнопкой в боте.</span>';
    return;
  }
  await load(userId);
}

init();
</script>
</body>
</html>
