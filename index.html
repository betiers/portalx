<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary-color: #d0bcff;
  --on-primary: #381e72;
  --text-main: #e6e1e5;
  --text-sub: #cac4d0;
  --font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  overflow-x: hidden;
}

body {
  background: #121015;
  color: var(--text-main);
  font-family: var(--font-family);
  min-height: 100vh;
  padding: 24px 16px 140px;
}

.wrapper {
  max-width: 600px;
  margin: 0 auto;
}

.gram-chip {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 60;
  display: none;
  align-items: center;
  gap: 7px;
  background: rgba(27, 25, 30, 0.92);
  border: 1px solid rgba(208, 188, 255, 0.25);
  border-radius: 999px;
  padding: 6px 14px 6px 10px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  animation: fade 0.5s 0.2s ease both;
}

.gram-chip .gram-icon {
  width: 22px;
  height: 22px;
}

.gram-chip .gram-value {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-main);
}

.gram-chip .gram-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--primary-color);
}

header {
  padding: 0 4px 18px;
  animation: fade 0.5s ease both;
}

header h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text-main);
}

header .sub {
  color: var(--text-sub);
  font-size: 13px;
  margin-top: 2px;
}

.view {
  display: none;
  animation: fade 0.35s ease both;
}

.view.active {
  display: block;
}

.bar {
  position: fixed;
  bottom: 16px;
  left: 0;
  right: 0;
  width: max-content;
  margin: 0 auto;
  background: rgba(29, 27, 32, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 50;
  display: flex;
  gap: 8px;
  padding: 8px;
  animation: fade 0.4s 0.15s ease both;
}

.indicator {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 0;
  background: var(--primary-color);
  border-radius: 999px;
  z-index: 0;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.bar button {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 68px;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-radius: 999px;
  transition: color 0.3s ease, transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

.bar button:active {
  transform: scale(0.94);
}

.bar button.active {
  color: var(--on-primary);
}

.bar button .material-symbols-outlined {
  font-size: 24px;
}

.bar button .bar-label {
  font-size: 11px;
  font-weight: 500;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="gram-chip" id="gramChip">
  <img class="gram-icon" src="gram.svg" alt="">
  <span class="gram-value" id="gramValue">—</span>
  <span class="gram-label">GRAM</span>
</div>

<div class="wrapper">
  <header>
    <h1 id="appTitle">Portals</h1>
    <p class="sub" id="userInfo">Загрузка...</p>
  </header>

  <div class="view active" id="viewHome"></div>

  <div class="view" id="viewProfile"></div>
</div>

<div class="bar">
  <span class="indicator" id="indicator"></span>
  <button class="active" data-view="home">
    <span class="material-symbols-outlined">home</span>
    <span class="bar-label">Главная</span>
  </button>
  <button data-view="profile">
    <span class="material-symbols-outlined">person</span>
    <span class="bar-label">Профиль</span>
  </button>
</div>

<script>
function findWebAppGlobal() {
  var candidates = [];
  Object.keys(window).forEach(function (k) {
    var v = window[k];
    if (v && typeof v === 'object') {
      if (v.WebApp && typeof v.WebApp === 'object') candidates.push(v.WebApp);
      if ('initData' in v || 'initDataUnsafe' in v) candidates.push(v);
    }
  });
  var preferred = ['Telegram', 'Catugram', 'Catup', 'WebApp'];
  var priority = {};
  preferred.forEach(function (n, i) { priority[n] = i; });
  candidates.sort(function (a, b) {
    var na = null, nb = null;
    preferred.forEach(function (p) {
      if (na === null && window[p] && (window[p] === a || (window[p].WebApp === a))) na = priority[p];
      if (nb === null && window[p] && (window[p] === b || (window[p].WebApp === b))) nb = priority[p];
    });
    return (na === null ? 99 : na) - (nb === null ? 99 : nb);
  });
  return candidates[0] || null;
}

function getInitData(tg) {
  if (tg && typeof tg.initData === 'string' && tg.initData) return tg.initData;
  var q = new URLSearchParams(location.search);
  if (q.get('tgWebAppData')) return q.get('tgWebAppData');
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('tgWebAppData')) return h.get('tgWebAppData');
  return null;
}

function resolveUser() {
  var tg = findWebAppGlobal();
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    return tg.initDataUnsafe.user;
  }
  var initData = getInitData(tg);
  if (initData) {
    var params = new URLSearchParams(initData);
    var raw = params.get('user');
    if (raw) {
      try {
        var obj = JSON.parse(decodeURIComponent(raw));
        if (obj && obj.id) return obj;
      } catch (e) {}
    }
  }
  var q = new URLSearchParams(location.search);
  var uid = q.get('user_id');
  if (uid) return { id: uid, username: q.get('username') || '' };
  return null;
}

const DATA_URL = 'http://2.26.229.5/data/data.txt';

function loadGram(user) {
  var chip = document.getElementById('gramChip');
  fetch(DATA_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var entry = data[String(user.id)] || data[user.id];
      var gram = entry && entry.gram != null ? Number(entry.gram) : null;
      if (gram == null) throw new Error('no gram');
      document.getElementById('gramValue').textContent = gram.toFixed(4).replace(/\.?0+$/, '');
      chip.style.display = 'flex';
    })
    .catch(function () {
      chip.style.display = 'flex';
      document.getElementById('gramValue').textContent = '0';
    });
}

function placeIndicator() {
  var bar = document.querySelector('.bar');
  var indicator = document.getElementById('indicator');
  var active = bar.querySelector('button.active');
  if (!active || !bar.offsetWidth) return;
  indicator.style.width = active.offsetWidth + 'px';
  indicator.style.transform = 'translateX(' + active.offsetLeft + 'px)';
}

function showView(name) {
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  document.querySelectorAll('.bar button').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-view') === name);
  });
  placeIndicator();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  requestAnimationFrame(function () {
    requestAnimationFrame(placeIndicator);
    placeIndicator();
  });

  var started = Date.now();
  var user = resolveUser();
  var timer = setInterval(function () {
    user = resolveUser();
    if (user || Date.now() - started > 4000) {
      clearInterval(timer);
      if (user) {
        var name = (user.first_name || user.username) ? user.first_name || user.username : 'Portals';
        document.getElementById('userInfo').textContent = name;
        loadGram(user);
      }
    }
  }, 200);

  var tg = findWebAppGlobal();
  if (tg && typeof tg.ready === 'function') tg.ready();
  if (tg && typeof tg.expand === 'function') tg.expand();

  document.querySelectorAll('.bar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      showView(btn.getAttribute('data-view'));
    });
  });

  window.addEventListener('resize', function () {
    requestAnimationFrame(placeIndicator);
  });
}

init();
</script>
</body>
</html>
